name: build-test-containers
on:
  push:
    paths:
      - .github/workflows/build-test-containers.yml
      - Dockerfile.test
  workflow_dispatch:
  schedule:
  - cron: 11 2 13 * *
permissions:
  packages: write
env:
  IMAGE_NAME: ghcr.io/toy/image_optim.test
  PERMANENT_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  ruby-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - env:
        RUBY_BUILD_TAG: ${{ env.IMAGE_NAME }}:ruby-build-${{ env.PERMANENT_SUFFIX }}
      run:
        docker build
          -f Dockerfile.test
          --target ruby-build
          -t "$RUBY_BUILD_TAG"
          --push
          .

  test-images:
    needs: ruby-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby:
        - '1.9'
        - '2.0'
        - '2.1'
        - '2.2'
        - '2.3'
        - '2.4'
        - '2.5'
        - '2.6'
        - '2.7'
        - '3.0'
        - '3.1'
        - '3.2'
        - '3.3'
        - '3.4'
        - '4.0'
      fail-fast: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - env:
        RUBY_BUILD_TAG: ${{ env.IMAGE_NAME }}:ruby-build-${{ env.PERMANENT_SUFFIX }}
        NAME_TAG: ${{ env.IMAGE_NAME }}:${{ matrix.ruby }}
        PERMANENT_TAG: ${{ env.IMAGE_NAME }}:${{ matrix.ruby }}-${{ env.PERMANENT_SUFFIX }}
      run: |
        set -euxo pipefail

        docker build \
          -f Dockerfile.test \
          --target test \
          --build-arg "RUBY_BUILD_TAG=$RUBY_BUILD_TAG" \
          --build-arg "RUBY_VERSION=${{ matrix.ruby }}" \
          -t "$PERMANENT_TAG" \
          .

        docker run --rm -i --volume "$PWD:/gem" "$PERMANENT_TAG" bundle exec bin/image_optim --info
        docker run --rm -i --volume "$PWD:/gem" "$PERMANENT_TAG" bundle exec rspec

        docker tag "$PERMANENT_TAG" "$NAME_TAG"
        docker push "$PERMANENT_TAG"
        docker push "$NAME_TAG"
