name: check
on:
  push:
  pull_request:
  schedule:
  - cron: 45 4 * * 2
permissions: {}
jobs:
  check:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        ruby:
        - '2.7'
        - '3.0'
        - '3.1'
        - '3.2'
        - '3.3'
        - '3.4'
        - '4.0'
        - jruby-9.4
        - jruby-10.1
      fail-fast: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      with:
        ruby-version: "${{ matrix.ruby }}"
        bundler-cache: true
    - run: npm install -g svgo
    - run: bundle exec image_optim --info
    - run: bundle exec rspec
  containers:
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.container }}
      options: --cap-add=SYS_ADMIN
    strategy:
      matrix:
        container:
        - alpine
        - debian:bookworm
        - debian:trixie
      fail-fast: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - run: |
        if command -v apt-get &> /dev/null; then
          apt-get update
          apt-get -y install make gcc git curl imagemagick ruby ruby-dev rubygems nodejs npm
        elif command -v apk &> /dev/null; then
          apk update
          apk add --no-cache build-base git curl perl imagemagick imagemagick-jpeg imagemagick-svg potrace ruby ruby-dev nodejs npm
        fi
    - run: npm install -g svgo
    - run: gem install bundler || gem install bundler --version '< 2.4'
    - run: bundle install
    - run: bundle exec bin/image_optim --info
    - run: bundle exec rspec
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        ruby:
        - '2.7'
        - '3.0'
        - '3.1'
        - '3.2'
        - '3.3'
        - '3.4'
        - '4.0'
      fail-fast: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      with:
        ruby-version: "${{ matrix.ruby }}"
        bundler-cache: true
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: "$HOME/bin"
        key: ${{ runner.os }}
    - run: |
        mkdir "$HOME/bin"
        git fetch origin windows-binaries
        git --work-tree="$HOME/bin" checkout origin/windows-binaries -- '*.exe'
        echo "$HOME/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - run: |
        choco install --no-progress imagemagick
        ls C:\'Program Files'\ImageMagick* | % FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - run: npm install -g svgo
    - run: bundle exec image_optim --info
    - run: bundle exec rspec
  update_worker_options_in_readme:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      with:
        ruby-version: '4'
        bundler-cache: true
    - run: script/update_worker_options_in_readme -n
