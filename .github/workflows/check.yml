name: check
on:
  push:
  pull_request:
  schedule:
  - cron: 45 4 * * 2
permissions: {}
jobs:
  check:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        ruby:
        - '2.7'
        - '3.0'
        - '3.1'
        - '3.2'
        - '3.3'
        - '3.4'
        - '4.0'
        - jruby-9.4
        - jruby-10.1
      fail-fast: false
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # v1.315.0
      with:
        ruby-version: "${{ matrix.ruby }}"
        bundler-cache: true
    - run: npm install -g svgo
    - run: bundle exec image_optim --info
    - run: bundle exec rspec
  containers:
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      matrix:
        container:
        - debian:bullseye
        - debian:bookworm
        # - alpine
      fail-fast: false
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - run: |
        if command -v apt-get &> /dev/null; then
          apt-get update
          apt-get -y install make gcc git curl imagemagick ruby ruby-dev rubygems
        fi
    - run: |
        curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
        . ~/.nvm/nvm.sh
        nvm install 20
        echo "PATH=$PATH" >> $GITHUB_ENV
    - run: npm install -g svgo
    - run: gem install bundler || gem install bundler --version '< 2.4'
    - run: bundle install
    - run: bundle exec bin/image_optim --info
    - run: bundle exec rspec
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        ruby:
        - '2.7'
        - '3.0'
        - '3.1'
        - '3.2'
        - '3.3'
        - '3.4'
        - '4.0'
      fail-fast: false
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # v1.315.0
      with:
        ruby-version: "${{ matrix.ruby }}"
        bundler-cache: true
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: "$HOME/bin"
        key: ${{ runner.os }}
    - run: |
        mkdir "$HOME/bin"
        git fetch origin windows-binaries
        git --work-tree="$HOME/bin" checkout origin/windows-binaries -- '*.exe'
        echo "$HOME/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - run: |
        choco install --no-progress imagemagick
        ls C:\'Program Files'\ImageMagick* | % FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - run: npm install -g svgo
    - run: bundle exec image_optim --info
    - run: bundle exec rspec
  update_worker_options_in_readme:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # v1.315.0
      with:
        ruby-version: '4'
        bundler-cache: true
    - run: script/update_worker_options_in_readme -n
