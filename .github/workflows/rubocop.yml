name: rubocop
on:
  push:
  pull_request:
  schedule:
  - cron: 45 4 * * 2
permissions: {}
jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4'
        bundler-cache: true
    - run: bundle exec rubocop
